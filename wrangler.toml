# Cloudflare Pages: the website (dist/) plus the social server in functions/.
# Deploy with `npm run deploy` (builds, updates the database tables, uploads).
name = "storystep"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# Users, finished tours, photo details and reports. Tables: migrations/.
[[d1_databases]]
binding = "DB"
database_name = "storystep"
database_id = "3cf24593-f89c-4077-abe8-eb3765276217"

# The photo files.
[[kv_namespaces]]
binding = "PHOTOS"
id = "221415be59a34d7a933a696f569e6aaf"

# "Walk with a friend" rooms, hosted by the storystep-duo Worker (duo/).
[[durable_objects.bindings]]
name = "DUO"
class_name = "DuoRoom"
script_name = "storystep-duo"
