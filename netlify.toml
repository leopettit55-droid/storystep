# Build settings for storystep.site. Once the site is linked to this GitHub
# repo in Netlify, every push to main builds and publishes automatically.
[build]
  # Exports the app, then writes a page per tour and the sitemap (see scripts/build-tour-pages.ts).
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: every other address loads the app, which then shows the right
# screen. Not forced, so files that exist (like dist/tour/<id>/index.html)
# are served first. public/_redirects does the same for manual deploys.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
