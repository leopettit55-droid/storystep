# Puts storystep.site live on every push to main (same as `npm run deploy`).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare "Edit Cloudflare Workers" token template
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard sidebar
name: Deploy to storystep.site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tolerates a pasted dashboard URL or stray spaces/newlines in the secrets:
      # keeps just the 32-character account ID and the bare token.
      - name: Deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$RAW_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -n1 || true)"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be the 32-character Account ID from the Cloudflare dashboard."
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID
          # On failure, show what the token can reach (names and IDs only).
          diagnose() {
            api() { curl -sS "https://api.cloudflare.com/client/v4$1" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"; }
            echo "::group::Cloudflare access check"
            echo "user token:";    api /user/tokens/verify | jq -c '{success, status: .result.status, errors}'
            echo "account token:"; api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -c '{success, status: .result.status, errors}'
            echo "accounts:";      api /accounts | jq -c '[.result[]? | {name, id_start: .id[0:8]}]'
            echo "D1:";            api "/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" | jq -c '{success, errors, dbs: [.result[]? | .name]}'
            echo "Pages:";         api "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" | jq -c '{success, errors, projects: [.result[]? | .name]}'
            echo "::endgroup::"
          }
          npm run deploy || { diagnose; exit 1; }
